<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
    <frameset rows="20%,80%">

    <!-- HEADER -->
    <frameset cols="20%,80%">
        <frame src="logo.html" name="logo">
        <frame src="header.html" name="header">
    </frameset>

    <!-- MAIN SECTION -->
    <frameset cols="20%,55%,25%">

        <!-- LEFT NAVIGATION -->
        <frame src="menu.html" name="menu">

        <!-- MAIN CONTENT -->
        <frame src="home.html" name="main">

        <!-- RIGHT INFORMATION -->
        <frame src="register.html" name="right">

    </frameset>
    <noframes>
        <p>noframe is used to show content when frames don't work.</p>
    </noframes>
</frameset>
</html>
