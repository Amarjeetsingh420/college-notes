<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>javaScript Boolean</h2>
    <script>
        let a = 20;
        let b = 5;

        let result1 = (a > b);
        let result2 = (a < b);
        let result3 = (a == b);

        document.write("a = " + a + "<br>");
        document.write("b = " + b + "<br>");
        document.write("a is greater than b: " + result1 + "<br>");
        document.write("a is less than b: " + result2 + "<br>");
        document.write("a is equal to b: " + result3 + "<br>");
    </script>
</body>
</html>
