<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>javascript string operations</h2>
    <script>
        let str = "Hello javascript";
        document.write("Original String: " + str + "<br>")
        document.write("String Length: " + str.length + "<br>")
        document.write("Uppercase: " + str.toUpperCase() + "<br>")
        document.write("Lowercase: " + str.toLowerCase() + "<br>")
        document.write("first Character: " + str.charAt(0) + "<br>")
        document.write("String Position: " + str.indexOf("java") + "<br>")
        document.write("Extracted String: " + str.slice(0,5) + "<br>")
    </script>
</body>
</html>
