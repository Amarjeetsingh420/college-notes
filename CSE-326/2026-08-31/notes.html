<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Hyperlinks</h1>
    <p>internal link:</p>
    <a href="#section1">Go to Section 1</a>
    <p>external link:</p>
    <a href="https://www.google.com">visit Google</a>
    <p>email link:</p>
    <a href="mailto:student@gmail.com">send email</a>
    <p>phone link:</p>
    <a href="tel:+1234567890">call us</a>
    <p>Self-Referencing Links</p>
    <a href="https://www.google.com" target="_self">Open Google in a same tab</a>
    <p>new tab:</p>
    <a href="https://www.google.com" target="_blank">Open Google in a new tab</a>
    <p>relative link:</p>
    <a href="page2.html">Go to Page 2</a>
    <p>absolute link:</p>
    <a href="https://www.example.com/page2.html">Go to Page 2</a>
</body>
</html>
